name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: E2E with fake binaries
        run: uv run pytest tests/integration/test_e2e_with_fake_binaries.py -v

      - name: Slash command template drift check
        run: uv run pytest tests/test_inline_config.py::test_canonical_spec_subcommands_match_cli_registry -v
