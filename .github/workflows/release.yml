name: Release

# Manual release ceremony. Does NOT publish — that is still triggered by
# the tag push (handled by publish.yml). This workflow runs the preflight
# gates that should have caught every v0.30.1 regression, opens the
# manual-smoke checklist issue, creates+pushes the tag, and finally smokes
# the published artefact from PyPI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z, no leading 'v')"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  # actions: write is required for the tag-and-publish job to invoke the
  # Publish workflow via `gh workflow run --ref v$VERSION`. Without it,
  # the GITHUB_TOKEN gets HTTP 403 "Resource not accessible by integration"
  # on the workflow_dispatch endpoint. Discovered during the v0.31.1
  # release; the manual workaround was `gh workflow run Publish --ref
  # v$VERSION` from a developer's machine.
  actions: write

jobs:
  preflight-checks:
    name: Preflight (version + changelog + drift + reviewer prompt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate _version.py matches input
        run: |
          PYV=$(uv run python -c "from _version import __version__; print(__version__)")
          echo "src/_version.py reports: $PYV"
          if [ "$PYV" != "${{ inputs.version }}" ]; then
            echo "::error::_version.py is at $PYV but release input is ${{ inputs.version }}"
            exit 1
          fi

      - name: Validate CHANGELOG entry exists
        run: |
          uv run python scripts/release_version.py "${{ inputs.version }}" --check-only --allow-npm-mismatch

      - name: Retrospective discipline check (Phase 8)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Compute the prior version from the input. For X.Y.Z, prior is the
          # immediately-previous version on disk in docs/retrospectives/. We use
          # the most-recent existing retrospective file as the "prior" anchor —
          # if none exists, this is the first retrospective and the check is a
          # no-op (warn but don't block).
          RETRO_DIR="docs/retrospectives"
          if [ ! -d "$RETRO_DIR" ]; then
            echo "::warning::No docs/retrospectives/ directory yet; this is fine for the first retrospective. Future releases must populate this."
            exit 0
          fi
          LATEST_RETRO=$(ls -1 "$RETRO_DIR"/*.md 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_RETRO" ]; then
            echo "::warning::docs/retrospectives/ exists but is empty; first retrospective is forthcoming."
            exit 0
          fi
          echo "Checking $LATEST_RETRO for required 'Next layer of failure' section..."
          # Required: presence of the section header AND at least one bullet under it.
          # Case-insensitive: heading may be "NEXT", "Next", or "next".
          if ! grep -qiE "^## .*next layer of failure" "$LATEST_RETRO"; then
            echo "::error::$LATEST_RETRO is missing the required '## 5. What's the NEXT layer of failure?' section."
            echo "::error::See docs/release-retrospective-template.md for the required structure."
            exit 1
          fi
          # Extract content between the Section 5 header and the next `## ` heading,
          # then count `- ` bullets. We use awk to find the start line, then stream
          # subsequent lines until the next `## ` header (excluding the start line
          # itself from the end-pattern match — the naive `/start/,/end/` form
          # collapses to one line because the start line also matches `^## `).
          CONTENT=$(awk '
            BEGIN { in_section = 0 }
            /^## / {
              if (in_section) { exit }
              if (tolower($0) ~ /next layer of failure/) { in_section = 1; next }
            }
            in_section { print }
          ' "$LATEST_RETRO" | grep -cE '^- ')
          if [ "$CONTENT" -lt 3 ]; then
            echo "::error::$LATEST_RETRO 'Next layer of failure' section has $CONTENT bullets; minimum 3 required."
            exit 1
          fi
          echo "Retrospective discipline check passed: $LATEST_RETRO has $CONTENT 'next layer' candidates."

      - name: Slash command template drift check
        run: uv run pytest tests/test_inline_config.py::test_canonical_spec_subcommands_match_cli_registry -v

      - name: Reviewer prompt sanity check
        run: |
          PROMPT=src/agents/prompts/reviewer.md
          if [ ! -f "$PROMPT" ]; then
            echo "::error::$PROMPT missing"
            exit 1
          fi
          SIZE=$(wc -c < "$PROMPT")
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::$PROMPT is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          if ! grep -q "VERDICT" "$PROMPT"; then
            echo "::error::$PROMPT missing canonical VERDICT marker"
            exit 1
          fi
          echo "reviewer prompt: $SIZE bytes, contains VERDICT"

      # v0.32.0 Phase 6: cheap grep-style preflights that lock the
      # integration of every v0.32.0 phase against accidental removal.
      # Each one would have caught a bug we shipped if it had existed.
      - name: Phase 1.1 dump fires on empty result (v0.31.1 regression)
        run: uv run pytest tests/test_adapter_empty_result_dump.py::test_claude_empty_result_with_is_error_true_still_dumps tests/test_adapter_empty_result_dump.py::test_cursor_empty_result_with_is_error_true_still_dumps -v

      - name: Architect feedback loop is wired
        run: |
          if ! grep -q "{rejection_history}" src/agents/prompts/architect.md; then
            echo "::error::src/agents/prompts/architect.md missing {rejection_history} placeholder (Phase 1.1)"
            exit 1
          fi
          echo "Architect feedback loop placeholder present."

      - name: Test runner self-diagnostic schema is wired
        run: |
          # Phase 3 schema spans multiple lines (``diagnosis: (`` then
          # ``Literal[ ... ]``). Use ``pcregrep`` multiline OR fall back
          # to ``grep -Pz`` when pcregrep is unavailable. Also accept the
          # one-line form so future schema reflows stay green.
          if grep -q "diagnosis: Literal" src/state/schemas.py; then
            echo "TestEvidence.diagnosis schema present (single-line form)."
          elif grep -Pzq "(?s)diagnosis:\s*\(\s*\n\s*Literal" src/state/schemas.py; then
            echo "TestEvidence.diagnosis schema present (multi-line form)."
          else
            echo "::error::src/state/schemas.py missing TestEvidence.diagnosis Literal (Phase 3)"
            exit 1
          fi

      - name: RecoveryHint is wired
        run: |
          if ! grep -q "class RecoveryHint" src/state/schemas.py; then
            echo "::error::src/state/schemas.py missing RecoveryHint class (Phase 5)"
            exit 1
          fi
          if ! grep -q "recovery_hint" src/cli/commands/status.py; then
            echo "::error::src/cli/commands/status.py missing recovery_hint integration (Phase 5)"
            exit 1
          fi
          echo "RecoveryHint schema and CLI surfacing present."

      # v0.33.0 Tier A: plan-phase unblock integration anchors. Each grep
      # would have caught a regression that re-broke the v0.32.0 fixture
      # if it had existed before the matching commit.
      - name: Plan-global files_new helper is wired (v0.33 A1)
        run: |
          if ! grep -q "_collect_plan_new_files" src/orchestrator/file_existence_validator.py; then
            echo "::error::src/orchestrator/file_existence_validator.py missing _collect_plan_new_files helper (v0.33 A1)"
            exit 1
          fi
          if ! grep -q "path_validation_resolved_via_plan_global" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing path_validation_resolved_via_plan_global op (v0.33 A1)"
            exit 1
          fi
          echo "Plan-global files_new helper + ledger op present."

      - name: Architect prompt carries v0.33 anchors (A2, A3)
        run: |
          if ! grep -q "\[new\] PREFIX RULE" src/agents/prompts/architect.md; then
            echo "::error::src/agents/prompts/architect.md missing '[new] PREFIX RULE' anchor (v0.33 A2)"
            exit 1
          fi
          if ! grep -q "NO INVESTIGATION NOTES" src/agents/prompts/architect.md; then
            echo "::error::src/agents/prompts/architect.md missing 'NO INVESTIGATION NOTES' anchor (v0.33 A3)"
            exit 1
          fi
          echo "Architect prompt v0.33 anchors present."

