name: Release

# Manual release ceremony. Does NOT publish — that is still triggered by
# the tag push (handled by publish.yml). This workflow runs the preflight
# gates that should have caught every v0.30.1 regression, opens the
# manual-smoke checklist issue, creates+pushes the tag, and finally smokes
# the published artefact from PyPI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z, no leading 'v')"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  # actions: write is required for the tag-and-publish job to invoke the
  # Publish workflow via `gh workflow run --ref v$VERSION`. Without it,
  # the GITHUB_TOKEN gets HTTP 403 "Resource not accessible by integration"
  # on the workflow_dispatch endpoint. Discovered during the v0.31.1
  # release; the manual workaround was `gh workflow run Publish --ref
  # v$VERSION` from a developer's machine.
  actions: write

jobs:
  preflight-checks:
    name: Preflight (version + changelog + drift + reviewer prompt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate _version.py matches input
        run: |
          PYV=$(uv run python -c "from _version import __version__; print(__version__)")
          echo "src/_version.py reports: $PYV"
          if [ "$PYV" != "${{ inputs.version }}" ]; then
            echo "::error::_version.py is at $PYV but release input is ${{ inputs.version }}"
            exit 1
          fi

      - name: Validate CHANGELOG entry exists
        run: |
          uv run python scripts/release_version.py "${{ inputs.version }}" --check-only --allow-npm-mismatch

      - name: Retrospective discipline check (Phase 8)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Compute the prior version from the input. For X.Y.Z, prior is the
          # immediately-previous version on disk in docs/retrospectives/. We use
          # the most-recent existing retrospective file as the "prior" anchor —
          # if none exists, this is the first retrospective and the check is a
          # no-op (warn but don't block).
          RETRO_DIR="docs/retrospectives"
          if [ ! -d "$RETRO_DIR" ]; then
            echo "::warning::No docs/retrospectives/ directory yet; this is fine for the first retrospective. Future releases must populate this."
            exit 0
          fi
          LATEST_RETRO=$(ls -1 "$RETRO_DIR"/*.md 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_RETRO" ]; then
            echo "::warning::docs/retrospectives/ exists but is empty; first retrospective is forthcoming."
            exit 0
          fi
          echo "Checking $LATEST_RETRO for required 'Next layer of failure' section..."
          # Required: presence of the section header AND at least one bullet under it.
          # Case-insensitive: heading may be "NEXT", "Next", or "next".
          if ! grep -qiE "^## .*next layer of failure" "$LATEST_RETRO"; then
            echo "::error::$LATEST_RETRO is missing the required '## 5. What's the NEXT layer of failure?' section."
            echo "::error::See docs/release-retrospective-template.md for the required structure."
            exit 1
          fi
          # Extract content between the Section 5 header and the next `## ` heading,
          # then count `- ` bullets. We use awk to find the start line, then stream
          # subsequent lines until the next `## ` header (excluding the start line
          # itself from the end-pattern match — the naive `/start/,/end/` form
          # collapses to one line because the start line also matches `^## `).
          CONTENT=$(awk '
            BEGIN { in_section = 0 }
            /^## / {
              if (in_section) { exit }
              if (tolower($0) ~ /next layer of failure/) { in_section = 1; next }
            }
            in_section { print }
          ' "$LATEST_RETRO" | grep -cE '^- ')
          if [ "$CONTENT" -lt 3 ]; then
            echo "::error::$LATEST_RETRO 'Next layer of failure' section has $CONTENT bullets; minimum 3 required."
            exit 1
          fi
          echo "Retrospective discipline check passed: $LATEST_RETRO has $CONTENT 'next layer' candidates."

      - name: Slash command template drift check
        run: uv run pytest tests/test_inline_config.py::test_canonical_spec_subcommands_match_cli_registry -v

      - name: Reviewer prompt sanity check
        run: |
          PROMPT=src/agents/prompts/reviewer.md
          if [ ! -f "$PROMPT" ]; then
            echo "::error::$PROMPT missing"
            exit 1
          fi
          SIZE=$(wc -c < "$PROMPT")
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::$PROMPT is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          if ! grep -q "VERDICT" "$PROMPT"; then
            echo "::error::$PROMPT missing canonical VERDICT marker"
            exit 1
          fi
          echo "reviewer prompt: $SIZE bytes, contains VERDICT"

      # v0.32.0 Phase 6: cheap grep-style preflights that lock the
      # integration of every v0.32.0 phase against accidental removal.
      # Each one would have caught a bug we shipped if it had existed.
      - name: Phase 1.1 dump fires on empty result (v0.31.1 regression)
        run: uv run pytest tests/test_adapter_empty_result_dump.py::test_claude_empty_result_with_is_error_true_still_dumps tests/test_adapter_empty_result_dump.py::test_cursor_empty_result_with_is_error_true_still_dumps -v

      - name: Architect feedback loop is wired
        run: |
          if ! grep -q "{rejection_history}" src/agents/prompts/architect.md; then
            echo "::error::src/agents/prompts/architect.md missing {rejection_history} placeholder (Phase 1.1)"
            exit 1
          fi
          echo "Architect feedback loop placeholder present."

      - name: Test runner self-diagnostic schema is wired
        run: |
          # Phase 3 schema spans multiple lines (``diagnosis: (`` then
          # ``Literal[ ... ]``). Use ``pcregrep`` multiline OR fall back
          # to ``grep -Pz`` when pcregrep is unavailable. Also accept the
          # one-line form so future schema reflows stay green.
          if grep -q "diagnosis: Literal" src/state/schemas.py; then
            echo "TestEvidence.diagnosis schema present (single-line form)."
          elif grep -Pzq "(?s)diagnosis:\s*\(\s*\n\s*Literal" src/state/schemas.py; then
            echo "TestEvidence.diagnosis schema present (multi-line form)."
          else
            echo "::error::src/state/schemas.py missing TestEvidence.diagnosis Literal (Phase 3)"
            exit 1
          fi

      - name: RecoveryHint is wired
        run: |
          if ! grep -q "class RecoveryHint" src/state/schemas.py; then
            echo "::error::src/state/schemas.py missing RecoveryHint class (Phase 5)"
            exit 1
          fi
          if ! grep -q "recovery_hint" src/cli/commands/status.py; then
            echo "::error::src/cli/commands/status.py missing recovery_hint integration (Phase 5)"
            exit 1
          fi
          echo "RecoveryHint schema and CLI surfacing present."

      # v0.33.0 Tier A: plan-phase unblock integration anchors. Each grep
      # would have caught a regression that re-broke the v0.32.0 fixture
      # if it had existed before the matching commit.
      - name: Plan-global files_new helper is wired (v0.33 A1)
        run: |
          if ! grep -q "_collect_plan_new_files" src/orchestrator/file_existence_validator.py; then
            echo "::error::src/orchestrator/file_existence_validator.py missing _collect_plan_new_files helper (v0.33 A1)"
            exit 1
          fi
          if ! grep -q "path_validation_resolved_via_plan_global" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing path_validation_resolved_via_plan_global op (v0.33 A1)"
            exit 1
          fi
          echo "Plan-global files_new helper + ledger op present."

      - name: Architect prompt carries v0.33 anchors (A2, A3)
        run: |
          if ! grep -q "\[new\] PREFIX RULE" src/agents/prompts/architect.md; then
            echo "::error::src/agents/prompts/architect.md missing '[new] PREFIX RULE' anchor (v0.33 A2)"
            exit 1
          fi
          if ! grep -q "NO INVESTIGATION NOTES" src/agents/prompts/architect.md; then
            echo "::error::src/agents/prompts/architect.md missing 'NO INVESTIGATION NOTES' anchor (v0.33 A3)"
            exit 1
          fi
          echo "Architect prompt v0.33 anchors present."

      # v0.34.0 Tier B: execute-phase unblock integration anchors.
      - name: Hallucination guard allowlist + downgrade wiring (v0.34 B1)
        run: |
          if ! grep -q "HALLUCINATION_ALLOWLISTS" src/qa/hallucination_guard.py; then
            echo "::error::src/qa/hallucination_guard.py missing HALLUCINATION_ALLOWLISTS (v0.34 B1)"
            exit 1
          fi
          if ! grep -q "hallucination_finding_downgraded" src/qa/hallucination_guard.py; then
            echo "::error::src/qa/hallucination_guard.py missing hallucination_finding_downgraded log op (v0.34 B1)"
            exit 1
          fi
          echo "Hallucination guard v0.34 B1 anchors present."

      - name: Sparse-checkout sibling-header helper + config (v0.34 B2)
        run: |
          if ! grep -q "_sibling_header_paths" src/orchestrator/worktree.py; then
            echo "::error::src/orchestrator/worktree.py missing _sibling_header_paths helper (v0.34 B2)"
            exit 1
          fi
          if ! grep -q "include_headers_for_sparse" src/config/schema.py; then
            echo "::error::src/config/schema.py missing include_headers_for_sparse field (v0.34 B2)"
            exit 1
          fi
          echo "Sparse-checkout v0.34 B2 anchors present."

      - name: Drift-verifier convergence helper + ledger op (v0.34 B3)
        run: |
          if ! grep -q "_patch_similarity" src/orchestrator/drift_verifier.py; then
            echo "::error::src/orchestrator/drift_verifier.py missing _patch_similarity helper (v0.34 B3)"
            exit 1
          fi
          if ! grep -q "drift_convergence_failure" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing drift_convergence_failure ledger op (v0.34 B3)"
            exit 1
          fi
          echo "Drift-verifier v0.34 B3 anchors present."

      # v0.35.0 Tier C: knowledge-base hygiene integration anchors.
      - name: Quarantine soft-flag + audit JSONL wiring (v0.35 C1)
        run: |
          if ! grep -q "quarantined:" src/state/knowledge.py; then
            echo "::error::src/state/knowledge.py missing quarantined field (v0.35 C1)"
            exit 1
          fi
          if ! grep -q "quarantine_audit.jsonl" src/state/knowledge.py; then
            echo "::error::src/state/knowledge.py missing quarantine_audit.jsonl literal (v0.35 C1)"
            exit 1
          fi
          if ! grep -q "_evaluate_quarantine" src/state/knowledge.py; then
            echo "::error::src/state/knowledge.py missing _evaluate_quarantine helper (v0.35 C1)"
            exit 1
          fi
          if ! grep -q "knowledge_entry_quarantined" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing knowledge_entry_quarantined op (v0.35 C1)"
            exit 1
          fi
          if ! grep -q "knowledge_lesson_credited" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing knowledge_lesson_credited op (v0.35 C1)"
            exit 1
          fi
          echo "Quarantine + lesson-credit anchors present."

      - name: Critic-evidence quality gate (v0.35 C2)
        run: |
          if ! grep -q "_critic_evidence_quality" src/state/knowledge.py; then
            echo "::error::src/state/knowledge.py missing _critic_evidence_quality (v0.35 C2)"
            exit 1
          fi
          echo "Critic-evidence gate anchor present."

      - name: Promotion threshold + 7-day decay curve (v0.35 C3)
        run: |
          if ! grep -q "confirmations_7d" src/state/knowledge.py; then
            echo "::error::src/state/knowledge.py missing confirmations_7d curve key (v0.35 C3)"
            exit 1
          fi
          echo "Promotion + decay anchor present."

      # v0.36.0 Tiers D + E + F + G: retries, budgets, forensics, spec
      # hygiene integration anchors. Each grep would have caught the
      # corresponding finding's regression if it had existed.
      - name: Recovery-tier + architect-attempt ops (v0.36 F1)
        run: |
          if ! grep -q "recovery_tier_attempted" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing recovery_tier_attempted op (v0.36 F1)"
            exit 1
          fi
          if ! grep -q "architect_attempt_failed" src/state/ledger.py; then
            echo "::error::src/state/ledger.py missing architect_attempt_failed op (v0.36 F1)"
            exit 1
          fi
          echo "v0.36 F1 ledger op anchors present."

      - name: NetworkProbeFailure exception class (v0.36 F2)
        run: |
          if ! grep -q "class NetworkProbeFailure" src/adapters/base.py; then
            echo "::error::src/adapters/base.py missing NetworkProbeFailure exception (v0.36 F2)"
            exit 1
          fi
          echo "v0.36 F2 NetworkProbeFailure anchor present."

      - name: Spec validator module exists (v0.36 G1)
        run: |
          if [ ! -f src/orchestrator/spec_validator.py ]; then
            echo "::error::src/orchestrator/spec_validator.py missing (v0.36 G1)"
            exit 1
          fi
          if ! grep -q "validate_spec_text" src/orchestrator/spec_validator.py; then
            echo "::error::src/orchestrator/spec_validator.py missing validate_spec_text helper (v0.36 G1)"
            exit 1
          fi
          echo "v0.36 G1 spec_validator anchor present."

      - name: huge_repo_multipliers default factory (v0.36 E1)
        run: |
          if ! grep -q "huge_repo_multipliers: dict\[str, float\] = Field" src/config/schema.py; then
            echo "::error::src/config/schema.py missing populated huge_repo_multipliers default factory (v0.36 E1)"
            exit 1
          fi
          echo "v0.36 E1 huge_repo_multipliers default anchor present."

      - name: Design-class diagnosis templates (v0.36 D1)
        run: |
          if ! grep -q "_DIAGNOSIS_TEMPLATES" src/orchestrator/retry_envelope.py; then
            echo "::error::src/orchestrator/retry_envelope.py missing _DIAGNOSIS_TEMPLATES (v0.36 D1)"
            exit 1
          fi
          echo "v0.36 D1 diagnosis-templates anchor present."

      - name: Structural-retry routing helper (v0.36 D3)
        run: |
          if ! grep -q "should_change_model_for_class" src/orchestrator/plan_phase_recovery.py; then
            echo "::error::src/orchestrator/plan_phase_recovery.py missing should_change_model_for_class (v0.36 D3)"
            exit 1
          fi
          echo "v0.36 D3 structural-retry helper anchor present."

  unit-tests:
    name: Unit tests + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Full pytest run (includes E2E with fake binaries)
        run: uv run pytest tests/ -v

  doctor-smoke:
    name: Doctor smoke (built wheel)
    runs-on: ubuntu-latest
    needs: [preflight-checks, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Install built wheel into a fresh venv
        run: |
          python -m venv /tmp/smokevenv
          /tmp/smokevenv/bin/pip install --upgrade pip
          /tmp/smokevenv/bin/pip install dist/*.whl

      - name: autodev --version
        run: |
          /tmp/smokevenv/bin/autodev --version

      - name: autodev doctor against empty tmp dir
        run: |
          mkdir -p /tmp/empty_proj
          cd /tmp/empty_proj
          /tmp/smokevenv/bin/autodev doctor || true

  manual-smoke-issue:
    name: Open manual smoke checklist issue
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Open release-smoke issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh issue create \
            --title "Manual smoke checklist for v$VERSION" \
            --body "$(cat <<EOF
          # Manual smoke checklist — v$VERSION

          Walk this list against a real local install before signing off.

          ## Adapter parity
          - [ ] \`autodev init --platform claude_code\` then \`plan\` then \`execute\` (Phase 0 regression)
          - [ ] \`autodev init --platform cursor\` then \`plan\` then \`execute\` (Phase 0 regression)

          ## Recovery commands
          - [ ] \`autodev requeue\` lists infrastructure-blocked tasks (Phase 0 fix)
          - [ ] \`autodev rewind <task>\` restores the prior state (Phase 0 fix)

          ## Doctor + fitness
          - [ ] \`autodev doctor\` shows the detected language profile (Phase 5)
          - [ ] \`autodev doctor\` shows fitness scores for each adapter (Phase 5)

          ## Cursor downshift visibility
          - [ ] After a forced usage-limit, \`autodev logs\` shows the downshift to \`auto+max-disabled\` (Phase 2.6)

          ## Hygiene
          - [ ] \`.autodev/execute_worktrees/\` is empty after \`execute\` finishes (Phase 5)
          EOF
          )"

  tag-and-publish:
    name: Tag and trigger publish
    runs-on: ubuntu-latest
    needs: [doctor-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "release-bot@autodev.local"
          git config user.name "autodev-release-bot"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      # GitHub limitation: workflows triggered by the default GITHUB_TOKEN
      # do NOT trigger downstream workflows. The tag push above therefore
      # does NOT fire publish.yml on its own. We invoke it explicitly via
      # workflow_dispatch (publish.yml has both ``push: tags`` and
      # ``workflow_dispatch`` triggers; this hits the latter directly).
      # Discovered during the v0.31.0 release.
      - name: Trigger publish workflow explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run Publish --ref "v$VERSION"

  post-publish-smoke:
    name: Post-publish smoke from PyPI
    runs-on: ubuntu-latest
    needs: [tag-and-publish]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for PyPI to index
        run: sleep 30

      - name: Install ai-autodev==${{ inputs.version }} from PyPI
        id: pip_install
        continue-on-error: true
        run: |
          python -m venv /tmp/postvenv
          /tmp/postvenv/bin/pip install --upgrade pip
          /tmp/postvenv/bin/pip install "ai-autodev==${{ inputs.version }}"

      - name: autodev --version (from PyPI)
        id: pyver
        if: steps.pip_install.outcome == 'success'
        continue-on-error: true
        run: /tmp/postvenv/bin/autodev --version

      - name: autodev doctor (from PyPI)
        id: pydoc
        if: steps.pip_install.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/post_smoke
          cd /tmp/post_smoke
          /tmp/postvenv/bin/autodev doctor || true

      - name: Open blocker issue if smoke failed
        if: |
          steps.pip_install.outcome == 'failure' ||
          steps.pyver.outcome == 'failure' ||
          steps.pydoc.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh issue create \
            --title "Post-publish smoke FAILED for v$VERSION" \
            --body "Post-publish smoke failed for v$VERSION. See workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
